[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "document-proxy"
version = "0.1.0"
description = "企微文档数据代理：REST + MCP 只读服务（FastAPI + FastMCP）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "fastmcp>=2.8",
    "python-dotenv>=1.0",
    "weixin-work-reborn>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
